# ${name}: fault stress and friction (FL = 16, linear slip-weakening)
# Generated by make_scenario from scenarios/${name}/scenario.yaml. Do not edit.
# Frame: x East, y North, z up (local origin in origin.json). Tension positive.
# Physics notes: docs/physics.md

!Switch
[mu_s, mu_d, d_c, s_xz, s_yz]: !ConstantMap
  map:
    mu_s: ${mu_s}
    mu_d: ${mu_d}
    d_c: ${d_c}
    s_xz: 0.0
    s_yz: 0.0

[cohesion]: !LuaMap
  returns: [cohesion]
  function: |
      function f (x)
        if x["z"] >= ${z_switch} then
          return { cohesion = ${cohesion_above} }
        else
          return { cohesion = ${cohesion_below} }
        end
      end

[s_xx, s_xy, s_yy, s_zz]: !LuaMap
  returns: [s_xx, s_xy, s_yy, s_zz]
  function: |
      function f (x)
        local grad_Sv = ${grad_Sv}   -- Pa/m
        local grad_SH = ${grad_SH}
        local grad_Sh = ${grad_Sh}
        local grad_Pf = ${grad_Pf}
        local az_SH   = ${az_SH}   -- deg clockwise from North

        -- nucleation disk on ${patch_fault}
        local x_nuc      = ${x_nuc}
        local y_nuc      = ${y_nuc}
        local z_nuc      = ${z_nuc}
        local strike_deg = ${strike_deg}
        local dip_deg    = ${dip_deg}
        local r_nuc      = ${r_nuc}   -- in-plane radius
        local n_tol      = ${n_tol}   -- max off-plane distance
        local dP         = ${dP}   -- overpressure, Pa
        local dTau       = ${dTau}   -- shear seed, Pa

        local th = az_SH * math.pi / 180.0
        local s2 = math.sin(th)^2
        local c2 = math.cos(th)^2
        local sc = math.sin(th) * math.cos(th)

        local z     = x["z"]
        local depth = -z
        if depth < 0.0 then depth = 0.0 end

        local SH_e = (grad_SH - grad_Pf) * depth
        local Sh_e = (grad_Sh - grad_Pf) * depth
        local Sv_e = (grad_Sv - grad_Pf) * depth

        local sxx = -(SH_e * s2 + Sh_e * c2)
        local syy = -(SH_e * c2 + Sh_e * s2)
        local sxy = -(SH_e - Sh_e) * sc
        local szz = -Sv_e

        local sr = strike_deg * math.pi / 180.0
        local dr = dip_deg    * math.pi / 180.0
        local sS, cS = math.sin(sr), math.cos(sr)
        local sD, cD = math.sin(dr), math.cos(dr)

        local vx = x["x"] - x_nuc
        local vy = x["y"] - y_nuc
        local vz = z      - z_nuc

        local s_par = vx*sS + vy*cS
        local d_par = vx*cS*cD - vy*sS*cD - vz*sD
        local n_off = -vx*cS*sD + vy*sS*sD - vz*cD

        if (s_par*s_par + d_par*d_par) <= r_nuc*r_nuc
           and math.abs(n_off) <= n_tol then
          sxx = sxx + dP
          syy = syy + dP
          szz = szz + dP
          sxy = sxy - dTau   -- sxy < 0 here: raises the resolved shear
        end

        return { s_xx = sxx, s_xy = sxy, s_yy = syy, s_zz = szz }
      end

# time-weakening seed, off while r_seed = 0 (ramp t_0 is in parameters.par)
[forced_rupture_time, Tnuc_n, Tnuc_s, Tnuc_d]: !LuaMap
  returns: [forced_rupture_time, Tnuc_n, Tnuc_s, Tnuc_d]
  function: |
      function f (x)
        local r_seed    = ${r_seed}
        local t_rupture = ${t_rupture}
        local dx = x["x"] - ${x_nuc}
        local dy = x["y"] - ${y_nuc}
        local dz = x["z"] - ${z_nuc}
        local frt = 1.0e10
        if r_seed > 0.0 and dx*dx + dy*dy + dz*dz <= r_seed*r_seed then
          frt = t_rupture
        end
        return { forced_rupture_time = frt, Tnuc_n = 0.0, Tnuc_s = 0.0, Tnuc_d = 0.0 }
      end

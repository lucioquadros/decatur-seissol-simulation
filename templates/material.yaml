# ${name}: layered elastic material, units and sources in data/material_units.csv
# Generated by make_scenario from scenarios/${name}/scenario.yaml. Do not edit.
# material.nc (build_material) holds the unit id, see docs/materials.md

!Any
components:
  - !AxisAlignedCuboidalDomainFilter
    limits: {x: [${x0}, ${x1}], y: [${y0}, ${y1}], z: [${z0}, ${z1}]}
    components: !ASAGI
      file: material.nc
      parameters: [unit_id]
      var: unit_id
      interpolation: nearest
      components: !LuaMap
        returns: [rho, mu, lambda]
        function: |
            function f (x)
                local u = math.floor(x["unit_id"] + 0.5)
${material_cases}
                error("unit_id " .. u .. " is not in material_units.csv")
            end
  - !AxisAlignedCuboidalDomainFilter   # above the grid: ${top_unit}
    limits: {x: [${x0}, ${x1}], y: [${y0}, ${y1}], z: [${z1}, .inf]}
    components: !ConstantMap
      map: ${material_top}
  - !AxisAlignedCuboidalDomainFilter   # below the grid: ${bottom_unit}
    limits: {x: [${x0}, ${x1}], y: [${y0}, ${y1}], z: [-.inf, ${z0}]}
    components: !ConstantMap
      map: ${material_bottom}

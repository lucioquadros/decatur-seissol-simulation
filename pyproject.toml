[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decatur"
version = "0.1.0"
description = "Decatur (IBDP) dynamic-rupture simulations with SeisSol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "h5py",
    "netCDF4",
    "gmsh",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "lupa"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
